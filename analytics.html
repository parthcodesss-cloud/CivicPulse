<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Analytics and insights from community civic data — CivicPulse">
    <title>Analytics — CivicPulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/analytics.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cGF0aCBmaWxsPSIjMTBiOTgxIiBkPSJNMjU2IDUxMkEyNTYgMjU2IDAgMSAwIDI1NiAwYTI1NiAyNTYgMCAxIDAgMCA1MTJ6bTAtMzgyVjI1NnY3Ni41YzAgOS44LTcuOSAxNy41LTE3LjUgMTcuNUMyMjguOCAzNTAgMjIwLjkgMzQyLjIgMjIwLjkgMzMyLjVWMTI5LjhjMC05LjggNy45LTE3LjUgMTcuNS0xNy41czE3LjUgNy43IDE3LjUgMTcuN1oiLz48L3N2Zz4=">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <header id="navbar"></header>
    <main class="main-content page-content">
        <div class="container">
            <div class="page-header">
                <div class="page-header__row">
                    <div>
                        <h1 class="page-header__title">Analytics</h1>
                        <p class="page-header__subtitle">Community civic data insights and trends</p>
                    </div>
                    <div class="page-header__actions">
                        <button class="btn btn--secondary btn--sm" id="exportCsvBtn">
                            <i class="fa-solid fa-download"></i> Export CSV
                        </button>
                    </div>
                </div>
            </div>

            <!-- Top Stats -->
            <div class="analytics-stats stagger-children" id="analyticsStats"></div>

            <!-- Charts Row 1 -->
            <div class="analytics-grid" id="chartsRow1"></div>

            <!-- Charts Row 2 -->
            <div class="analytics-grid" id="chartsRow2"></div>

            <!-- Area Map -->
            <div class="analytics-grid analytics-grid--full" style="margin-bottom: var(--space-6);">
                <div class="chart-panel" id="areaMapPanel">
                    <div class="chart-panel__header">
                        <h2 class="chart-panel__title">
                            <i class="fa-solid fa-map-location-dot"></i> Area Visualization
                        </h2>
                    </div>
                    <div id="areaMap"></div>
                </div>
            </div>

            <!-- Area Intelligence -->
            <div class="area-intelligence" id="areaIntelligence">
                <div class="chart-panel">
                    <div class="chart-panel__header">
                        <h2 class="chart-panel__title">
                            <i class="fa-solid fa-magnifying-glass-location"></i> Area Intelligence
                        </h2>
                    </div>
                    <div class="area-selector">
                        <label class="area-selector__label" for="areaSelect">Select Area:</label>
                        <select class="filter-select" id="areaSelect" style="min-width: 200px;">
                            <option value="">Choose an area...</option>
                        </select>
                    </div>
                    <div id="areaDetail"></div>
                </div>
            </div>
        </div>
    </main>
    <footer id="footer"></footer>
    <script src="js/utils.js"></script>
    <script src="js/storageAdapter.js"></script>
    <script src="js/dataService.js"></script>
    <script src="js/seedData.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/router.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
    <script src="js/analytics.js"></script>
    <script src="js/scrollReveal.js"></script>
    <script>
        // CSV Export button
        document.addEventListener('DOMContentLoaded', () => {
            const exportBtn = document.getElementById('exportCsvBtn');
            if (exportBtn) {
                exportBtn.addEventListener('click', () => {
                    const reports = DataService.getReports();
                    ScrollReveal.exportToCSV(reports);
                });
            }
        });
    </script>
</html>
